<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
    <div class="container">
        <header>
            <h1>♔ Chess Game ♔</h1>
            <div class="game-info">
                <div class="turn-indicator">
                    <span id="current-turn">White's Turn</span>
                </div>
                <div class="status" id="game-status"></div>
            </div>
            <div class="warning-message" id="warning-message"></div>
        </header>
        
        <div class="game-board-container">
            <div class="board-frame">
                <div class="coords files files-top" id="files-top"></div>
                <div class="coords ranks ranks-left" id="ranks-left"></div>
                <div id="chessboard"></div>
                <div class="coords ranks ranks-right" id="ranks-right"></div>
                <div class="coords files files-bottom" id="files-bottom"></div>
            </div>
        </div>
        
        <div class="controls">
            <button id="reset-btn">New Game</button>
            <button id="flip-board">Flip Board</button>
            <button id="ai-toggle">AI: ON</button>
            <button id="ninja-btn">🥷 Ninja</button>
        </div>
        <div class="controls castle-controls">
            <button id="castle-left" class="castle-btn">🏰 Castle Left</button>
            <button id="castle-right" class="castle-btn">🏰 Castle Right</button>
        </div>
        <div class="ninja-message" id="ninja-message"></div>
        
        <div class="promotion-overlay" id="promotion-overlay">
            <div class="promotion-dialog">
                <h3>🎉 Your pawn made it! What should he become?</h3>
                <div class="promotion-choices" id="promotion-choices"></div>
                <p class="promotion-hint">Click outside or press Esc to cancel</p>
            </div>
        </div>
        
        <div class="move-history">
            <h3>Move History</h3>
            <div id="move-list"></div>
        </div>
        
        <footer class="contact-info">
            <p>TgSofts +9725914007</p>
        </footer>
    </div>
    
    <script src="chess.js?v=7"></script>
</body>
</html>
